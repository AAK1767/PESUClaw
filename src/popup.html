<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 18px;
      color: #e5eef8;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }
    h2 {
      font-size: 16px;
      margin: 0 0 6px;
      color: #67d5ff;
    }
    p {
      font-size: 12px;
      margin: 4px 0;
      line-height: 1.5;
      color: #a8b7c9;
    }
    .hint {
      margin-top: 12px;
      padding: 8px;
      background: #182235;
      border: 1px solid #263449;
      border-radius: 9px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .update {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      background: #153b32;
      color: #bbf7d0;
      border: 1px solid #23624e;
    }
    .update.checking {
      background: #182235;
      color: #a8b7c9;
      border-color: #263449;
    }
    .update.error {
      background: #401d2a;
      color: #fda4af;
      border-color: #713044;
    }
    .update a {
      color: #67d5ff;
      text-decoration: none;
      font-weight: 600;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #718096;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>PESUClaw</h2>
  <p>Bulk download & merge course materials from PESU Academy — slides, notes, assignments, QA, and QB.</p>
  <div class="hint">
    Open any course on <strong>PESU Academy</strong>, then click the <strong>PESUClaw</strong> tab to get started.
  </div>
  <div class="update checking" id="update-status">Checking GitHub for updates...</div>
  <div class="footer" id="version-footer"></div>
  <script src="popup.js"></script>
</body>
</html>
