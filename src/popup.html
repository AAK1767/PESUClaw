<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PESUClaw</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #101a2e;
      --surface: #14203a;
      --surface-2: #1a2b4a;
      --border: #223253;
      --border-strong: #34496f;
      --text: #e8eef9;
      --muted: #93a5bf;
      --faint: #6c7f9c;
      --accent: #38bdf8;
      --accent-ink: #03202e;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #fb7185;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 0;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .strip {
      height: 3px;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8 55%, #67e8f9);
    }

    .wrap { padding: 16px 18px 14px; }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      color: var(--accent-ink);
      background: linear-gradient(135deg, #0ea5e9, #67e8f9);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.35);
    }

    .logo svg { width: 22px; height: 22px; }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .tagline {
      margin: 1px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .steps {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
    }

    .steps li {
      position: relative;
      margin: 0 0 9px;
      padding-left: 30px;
      color: #c4d0e2;
      font-size: 12.5px;
      counter-increment: step;
    }

    .steps li::before {
      content: counter(step);
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      color: #bfe8ff;
      font-size: 11px;
      font-weight: 700;
    }

    .steps strong { color: var(--text); font-weight: 600; }

    .update {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 10px;
      background: rgba(52, 211, 153, 0.09);
      color: #9be8c6;
      font-size: 12px;
      line-height: 1.5;
    }

    .update::before {
      content: "";
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .update.checking {
      border-color: var(--border);
      background: var(--surface);
      color: var(--muted);
    }

    .update.checking::before {
      width: 12px;
      height: 12px;
      margin-top: 3px;
      border: 2px solid rgba(56, 189, 248, 0.25);
      border-top-color: var(--accent);
      background: none;
      animation: spin 0.7s linear infinite;
    }

    .update.available {
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.09);
      color: #fcd58a;
    }

    .update.error {
      border-color: rgba(251, 113, 133, 0.4);
      background: rgba(251, 113, 133, 0.09);
      color: #fda4b1;
    }

    .update a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .update a:hover { text-decoration: underline; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: filter 0.15s, background 0.15s, border-color 0.15s;
    }

    .btn svg { width: 16px; height: 16px; }

    .btn-primary {
      flex: 1 1 auto;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: var(--accent-ink);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.28);
    }

    .btn-primary:hover { filter: brightness(1.08); }

    .btn-ghost {
      flex: 0 0 auto;
      border: 1px solid var(--border-strong);
      color: var(--text);
    }

    .btn-ghost:hover { background: var(--surface-2); border-color: var(--accent); }

    .btn:focus-visible, .update a:focus-visible, .footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
      color: var(--faint);
      font-size: 11px;
    }

    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="strip"></div>
  <div class="wrap">
    <header>
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17"/></svg>
      </span>
      <div>
        <h1>PESUClaw</h1>
        <p class="tagline">Bulk download &amp; merge PESU Academy materials</p>
      </div>
    </header>

    <ol class="steps">
      <li>Open a course on <strong>PESU Academy</strong></li>
      <li>Click the <strong>PESUClaw</strong> tab next to the units</li>
      <li>Pick resources, tick the files, hit <strong>Download</strong></li>
    </ol>

    <div class="update checking" id="update-status" role="status" aria-live="polite">Checking for updates&hellip;</div>

    <div class="actions">
      <a class="btn btn-primary" href="https://www.pesuacademy.com/Academy/s/studentProfilePESU" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
        Open PESU Academy
      </a>
      <a class="btn btn-ghost" id="releases-link" href="https://github.com/AAK1767/PESUClaw/releases/latest" target="_blank" rel="noreferrer">Releases</a>
    </div>

    <div class="footer">
      <span id="version-footer"></span>
      <a href="https://github.com/AAK1767/PESUClaw" target="_blank" rel="noreferrer">GitHub</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
