<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1d3756;
      background: linear-gradient(180deg, #f7fbfe 0%, #ffffff 100%);
    }
    h2 {
      font-size: 16px;
      margin: 0 0 6px;
      color: #0091CD;
    }
    p {
      font-size: 12px;
      margin: 4px 0;
      line-height: 1.5;
      color: #555;
    }
    .hint {
      margin-top: 12px;
      padding: 8px;
      background: #f0f7fc;
      border-radius: 6px;
      font-size: 11px;
      color: #1d3756;
    }
    .update {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      background: #eef8f1;
      color: #224d2f;
      border: 1px solid #cfe8d6;
    }
    .update.checking {
      background: #f5f8fb;
      color: #4c5f72;
      border-color: #dde6ef;
    }
    .update.error {
      background: #fff4f1;
      color: #8a3b25;
      border-color: #f3d3c8;
    }
    .update a {
      color: #0091CD;
      text-decoration: none;
      font-weight: 600;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>PESUClaw</h2>
  <p>Bulk download & merge course materials from PESU Academy — slides, notes, assignments, QA, and QB.</p>
  <div class="hint">
    Open any course on <strong>PESU Academy</strong>, then click the <strong>PESUClaw</strong> tab to get started.
  </div>
  <div class="update checking" id="update-status">Checking GitHub for updates...</div>
  <div class="footer" id="version-footer"></div>
  <script src="popup.js"></script>
</body>
</html>
